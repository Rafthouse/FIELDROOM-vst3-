name: Build Native VST3 & AU Plugins

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Universal 2 (Apple Silicon arm64 + Intel x86_64)
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: brew install ninja cmake

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build VST3 & AU Targets
        run: cmake --build build --config Release --parallel

      - name: Run Headless DSP Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS Bundles
        run: |
          mkdir -p dist-macos
          cd build/FIELDROOM_artefacts/Release
          zip -r ../../../dist-macos/FIELDROOM-macOS-Universal2.zip VST3/FIELDROOM.vst3 AU/FIELDROOM.component
          cd ../../..

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIELDROOM-macOS-Universal2
          path: dist-macos/FIELDROOM-macOS-Universal2.zip
          if-no-files-found: error

  build-windows:
    name: Windows x86-64 MSVC
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 Target
        run: cmake --build build --config Release --parallel

      - name: Run Headless DSP Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Compress-Archive -Path build/FIELDROOM_artefacts/Release/VST3/FIELDROOM.vst3 -DestinationPath dist-windows/FIELDROOM-Windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIELDROOM-Windows-x64
          path: dist-windows/FIELDROOM-Windows-x64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: FIELDROOM-macOS-Universal2
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: FIELDROOM-Windows-x64
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
